<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="RoutePilot">
  <defs>
    <!-- Gradiente de fundo escuro moderno -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1035" />
      <stop offset="45%" stop-color="#0e0a1f" />
      <stop offset="100%" stop-color="#070a14" />
    </linearGradient>

    <!-- Gradiente do badge -->
    <linearGradient id="primaryGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Gradiente da linha de rota -->
    <linearGradient id="routeGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Brilho suave -->
    <radialGradient id="halo" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Fundo com cantos arredondados -->
  <rect width="512" height="512" rx="120" fill="url(#bg)" />
  <rect width="512" height="512" rx="120" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="4" />

  <!-- Halo de iluminação central -->
  <circle cx="256" cy="240" r="210" fill="url(#halo)" />

  <!-- Card interno flutuante -->
  <rect x="76" y="76" width="360" height="360" rx="72" fill="url(#primaryGrad)" fill-opacity="0.14" stroke="#a855f7" stroke-opacity="0.3" stroke-width="2" />

  <!-- Rota conectando nós (representando roteamento de IA / OminRoute) -->
  <path
    d="M 148 356 C 200 356, 185 240, 256 240 C 325 240, 310 156, 364 156"
    fill="none"
    stroke="url(#routeGrad)"
    stroke-width="24"
    stroke-linecap="round"
    filter="url(#glow)"
  />

  <!-- Nó 1 (origem - cliente) -->
  <circle cx="148" cy="356" r="32" fill="#0e0a1f" stroke="#38bdf8" stroke-width="8" filter="url(#glow)" />
  <circle cx="148" cy="356" r="14" fill="#38bdf8" />

  <!-- Nó 2 (hub / roteador central - OminRoute) -->
  <circle cx="256" cy="240" r="42" fill="#0e0a1f" stroke="#c084fc" stroke-width="9" filter="url(#glow)" />
  <circle cx="256" cy="240" r="20" fill="#a855f7" />
  <circle cx="256" cy="240" r="56" fill="none" stroke="#a855f7" stroke-opacity="0.4" stroke-width="3" stroke-dasharray="6 6" />

  <!-- Nó 3 (destino - modelo de IA) -->
  <circle cx="364" cy="156" r="32" fill="#0e0a1f" stroke="#f43f5e" stroke-width="8" filter="url(#glow)" />
  <circle cx="364" cy="156" r="14" fill="#f43f5e" />

  <!-- Pequenos pulsos orbitando -->
  <circle cx="198" cy="300" r="6" fill="#67e8f9" opacity="0.8" />
  <circle cx="314" cy="192" r="6" fill="#fda4af" opacity="0.8" />

  <!-- Ícone de cadeado de segurança sutil no canto inferior direito -->
  <g transform="translate(356, 356)">
    <rect x="0" y="8" width="22" height="18" rx="4" fill="#10b981" />
    <path d="M 4 8 V 5 A 7 7 0 0 1 18 5 V 8" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
    <circle cx="11" cy="16" r="2" fill="#0e0a1f" />
  </g>
</svg>
